<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>VL53L7CX x2 + Bone Mic — Live Monitor</title>
<!-- bridge_server.py serves this same file at both "/" and "/panel/" (see
     CONTRACTS.md ch.1 note re: mock_device.py / panel routing); without a
     fixed base, relative asset URLs resolve differently depending on which
     one loaded the page and 404 at "/". Absolute API calls (fetch, SSE)
     elsewhere in this app already use a leading slash and are unaffected. -->
<base href="/panel/">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/modes/monitor.css">
<link rel="stylesheet" href="css/modes/record.css">
<link rel="stylesheet" href="css/modes/quiz.css">
<link rel="stylesheet" href="css/modes/validate.css">
<link rel="stylesheet" href="css/modes/replay.css">
</head>
<body>

<div id="app" class="app-shell">
  <nav id="sidebar" class="sidebar">
    <div class="status-connection" data-status-connection>
      <span id="linkDot" class="link-dot"></span>
      <span class="status-conn-text" data-status-conn-text>連線中…</span>
    </div>
    <div class="device-picker" data-device-picker>
      <button class="device-scan-btn" data-device-scan-btn
        title="換一個埠／重新連接裝置（bridge_server.py 要先在終端機跑起來）"
        aria-expanded="false">
        <span class="mode-icon">🔌</span><span class="mode-label">掃描裝置</span>
      </button>
      <div class="device-picker-panel" data-device-picker-panel style="display:none">
        <div class="device-picker-hint">這顆按鈕是「換埠／重新連接」，不是「啟動整個系統」——
          bridge_server.py 要先從終端機啟動，這裡才找得到它。</div>
        <div class="device-picker-status" data-device-picker-status></div>
        <div class="device-picker-list" data-device-picker-list></div>
        <div class="device-picker-error" data-device-picker-error style="display:none"></div>
      </div>
    </div>
    <div class="status-warning" data-status-warning style="display:none"></div>
    <ul class="mode-nav">
      <li><button class="mode-nav-item active" data-mode="monitor">
        <span class="mode-icon">▣</span><span class="mode-label">監測</span><span class="mode-key mono">1</span>
      </button></li>
      <li><button class="mode-nav-item" data-mode="record">
        <span class="mode-icon">⏺</span><span class="mode-label">錄製</span><span class="mode-key mono">2</span>
      </button></li>
      <li><button class="mode-nav-item" data-mode="quiz">
        <span class="mode-icon">◎</span><span class="mode-label">測驗</span><span class="mode-key mono">3</span>
      </button></li>
      <li><button class="mode-nav-item" data-mode="validate">
        <span class="mode-icon">⚗</span><span class="mode-label">驗證</span><span class="mode-key mono">4</span>
      </button></li>
      <li><button class="mode-nav-item" data-mode="replay">
        <span class="mode-icon">▶</span><span class="mode-label">回放</span><span class="mode-key mono">5</span>
      </button></li>
    </ul>
    <button class="status-summary" data-status-summary title="點擊查看完整品質面板（監測模式）">
      <div class="status-summary-row">
        <span class="status-summary-label">掉幀</span>
        <span class="status-summary-value mono" data-status-drop>--</span>
      </div>
      <div class="status-summary-row">
        <span class="status-summary-label">對稱</span>
        <span class="status-summary-value mono" data-status-symmetry>--</span>
      </div>
      <div class="status-summary-row">
        <span class="status-summary-value mono status-summary-fps" data-status-fps>-- Hz</span>
      </div>
    </button>
    <button id="projectorToggle" class="collapse-toggle projector-toggle" title="投影模式：放大所有字級（P）"
      aria-label="投影模式" aria-pressed="false">
      <span class="mode-icon">◱</span><span class="mode-label">投影模式</span><span class="mode-key mono">P</span>
    </button>
    <button id="collapseToggle" class="collapse-toggle" title="摺疊側邊欄（\）" aria-label="摺疊側邊欄">
      <span class="mode-icon">«</span><span class="mode-label">摺疊</span><span class="mode-key mono">\</span>
    </button>
  </nav>

  <main id="mainContent" class="main-content">
    <section id="mode-monitor" class="mode-section active" data-mode="monitor"></section>
    <section id="mode-record" class="mode-section" data-mode="record"></section>
    <section id="mode-quiz" class="mode-section" data-mode="quiz"></section>
    <section id="mode-validate" class="mode-section" data-mode="validate"></section>
    <section id="mode-replay" class="mode-section" data-mode="replay"></section>
  </main>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
